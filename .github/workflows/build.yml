name: Build Saicord Extensions

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true
        id: checkout-builds

      - name: Init builds branch if missing
        if: steps.checkout-builds.outcome == 'failure'
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/builds
          git init
          git checkout --orphan builds
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          echo "# Build artifacts" > README.md
          git add .
          git commit -m "Init builds branch"
          git push -u origin builds

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Bengali Provider
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew SaicordBn:make

      - name: Build Hindi Provider
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew SaicordHi:make

      - name: Generate plugins.json
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew makePluginsJson

      - name: Copy build artifacts
        run: |
          cp $GITHUB_WORKSPACE/src/**/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp $GITHUB_WORKSPACE/src/build/plugins.json $GITHUB_WORKSPACE/builds/ || true

      - name: Upload Bengali Plugin
        uses: actions/upload-artifact@v4
        with:
          name: SaicordBn
          path: ${{ github.workspace }}/src/**/build/*.cs3
          retention-days: 30

      - name: Upload Hindi Plugin
        uses: actions/upload-artifact@v4
        with:
          name: SaicordHi
          path: ${{ github.workspace }}/src/**/build/*.cs3
          retention-days: 30

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            ${{ github.workspace }}/src/**/build/*.cs3
          body: |
            ## Saicord CloudStream Extensions

            ### Bengali (bn)
            - Supports Movies, Series, Cartoons
            - Website: https://saicord.com/bn/

            ### Hindi (hi)
            - Supports Movies, Series, Cartoons
            - Website: https://saicord.com/hi/

            ### Installation
            1. Open CloudStream app
            2. Go to Settings > Extensions
            3. Add repository: `https://raw.githubusercontent.com/mahdiridoy/Saicord-Extensions/main/repo.json`
            4. Install the extensions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
