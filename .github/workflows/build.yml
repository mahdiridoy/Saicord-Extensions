name: Build Saicord Extensions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Bengali Provider
        run: ./gradlew SaicordBn:make

      - name: Build Hindi Provider
        run: ./gradlew SaicordHi:make

      - name: Upload Bengali Plugin
        uses: actions/upload-artifact@v4
        with:
          name: SaicordBn
          path: SaicordBn/build/outputs/**/*.cs3
          retention-days: 30

      - name: Upload Hindi Plugin
        uses: actions/upload-artifact@v4
        with:
          name: SaicordHi
          path: SaicordHi/build/outputs/**/*.cs3
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            SaicordBn/build/outputs/**/*.cs3
            SaicordHi/build/outputs/**/*.cs3
          body: |
            ## Saicord CloudStream Extensions
            
            ### Bengali (bn)
            - Supports Movies, Series, Cartoons, TV+
            - Website: https://saicord.com/bn/
            
            ### Hindi (hi)
            - Supports Movies, Series, Cartoons, TV+
            - Website: https://saicord.com/hi/
            
            ### Installation
            1. Open CloudStream app
            2. Go to Settings > Extensions
            3. Add repository: `https://raw.githubusercontent.com/mahdiridoy/Saicord-Extensions/main/repo.json`
            4. Install the extensions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
